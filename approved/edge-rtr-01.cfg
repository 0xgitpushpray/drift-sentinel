version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
hostname edge-rtr-01
boot-start-marker
boot-end-marker
logging buffered 64000 informational
enable secret 9 $9$DEMOONLYedgehash$cccccccccccccccccccccccccccccccccccccccccc
aaa new-model
aaa authentication login default group tacacs+ local
ip domain name example.net
ip ssh version 2
username netops privilege 15 secret 9 $9$DEMOONLYedgeuser$ddddddddddddddddddddddddddddddddddddd
interface Loopback0
 description Router-ID
 ip address 10.255.0.2 255.255.255.255
interface GigabitEthernet0/0/0
 description Internet - ISP-A circuit 88213
 ip address 203.0.113.2 255.255.255.252
 ip access-group INTERNET-IN in
 ip nat outside
 no shutdown
interface GigabitEthernet0/0/1
 description Downlink to core-rtr-01
 ip address 10.0.12.2 255.255.255.252
 ip nat inside
 no shutdown
interface GigabitEthernet0/0/2
 description UNUSED
 no ip address
 shutdown
router bgp 64512
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 64496
 neighbor 203.0.113.1 description ISP-A
 neighbor 203.0.113.1 password 7 094F471A1A0A
 address-family ipv4
  network 198.51.100.0 mask 255.255.255.0
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 prefix-list ISP-A-OUT out
 exit-address-family
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0/0 overload
ip route 198.51.100.0 255.255.255.0 Null0
ip access-list standard NAT-INSIDE
 10 permit 10.0.0.0 0.255.255.255
ip access-list extended INTERNET-IN
 10 permit tcp any any established
 20 permit udp any eq domain any
 30 permit icmp any any echo-reply
 40 permit tcp host 203.0.113.1 host 203.0.113.2 eq bgp
 100 deny ip any any log
ip prefix-list ISP-A-OUT seq 10 permit 198.51.100.0/24
logging host 10.99.0.20
tacacs server TAC1
 address ipv4 10.99.0.10
 key 7 0822455D0A16544541
line vty 0 4
 transport input ssh
ntp server 10.99.0.1
end
