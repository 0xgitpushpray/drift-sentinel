# drift-sentinel inventory
#
# Out of the box this file points at the demo configs in examples/running/, so the
# nightly workflow has something to check. Replace the devices below with your own
# routers (see README "Point it at your network").

settings:
  approved_dir: approved      # baselines live in approved/<name>.cfg
  secrets: compare            # "compare": a changed password counts as drift (always redacted in output)
                              # "mask":    redact both sides first, for baselines stored without secrets
  context_lines: 3
  ignore:                     # regexes; matching lines are ignored on every device
    - '^ntp clock-period'

defaults:                     # applied to every device unless the device overrides it
  platform: cisco_ios         # netmiko device_type: cisco_ios, cisco_xe, cisco_xr, cisco_nxos, arista_eos, juniper_junos, ...
  collector: ssh              # ssh | file | command
  username_env: ROUTER_USERNAME
  password_env: ROUTER_PASSWORD

devices:
  # --- demo devices (file collector reads a saved config instead of logging in) ---
  - name: core-rtr-01
    collector: file
    path: examples/running/core-rtr-01.cfg

  - name: edge-rtr-01
    collector: file
    path: examples/running/edge-rtr-01.cfg

  - name: branch-rtr-01
    platform: juniper_junos
    collector: file
    path: examples/running/branch-rtr-01.cfg

